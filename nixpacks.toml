[phases.install]
commands = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.postInstall]
commands = [
  # Playwright should install **after** dependencies, not in the same phase
  ". /opt/venv/bin/activate && playwright install chromium"
]

[start]
cmd = ". /opt/venv/bin/activate && python run_bot_wrapper.py"
