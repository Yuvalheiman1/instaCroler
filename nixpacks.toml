# nixpacks.toml

[phases.setup]
nixpkgs = ["python310", "nodejs", "curl", "wget"]

[phases.install]
commands = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[phases.postInstall]
commands = [
  "/opt/venv/bin/playwright install chromium"
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/root/playwright-cache"

[caches.playwright]
path = "/root/playwright-cache"


[start]
cmd = "/opt/venv/bin/python run_bot_wrapper.py"
